        /* Custom pattern for background */
        .bg-finance-pattern {
            background-color: #f6f6f8;
            background-image: url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%23135bec' fill-opacity='0.03'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
        }

<body class="font-display bg-finance-pattern min-h-screen flex flex-col text-slate-900 overflow-x-hidden antialiased selection:bg-primary/20 selection:text-primary">
<!-- Header / Navigation (Simplified for Login Page) -->
<header class="w-full px-6 py-4 flex items-center justify-between absolute top-0 left-0 z-10">
<div class="flex items-center gap-2">
<div class="w-8 h-8 text-primary">
<svg fill="none" viewbox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">
<path d="M13.8261 30.5736C16.7203 29.8826 20.2244 29.4783 24 29.4783C27.7756 29.4783 31.2797 29.8826 34.1739 30.5736C36.9144 31.2278 39.9967 32.7669 41.3563 33.8352L24.8486 7.36089C24.4571 6.73303 23.5429 6.73303 23.1514 7.36089L6.64374 33.8352C8.00331 32.7669 11.0856 31.2278 13.8261 30.5736Z" fill="currentColor"></path>

</div>
<h2 class="text-[#111318] text-lg font-bold leading-tight tracking-[-0.015em]">Citi Group</h2>
</div>
<div class="hidden sm:block">
<a class="text-sm font-medium text-slate-500 hover:text-primary transition-colors" href="#">Contact Support</a>
</div>
</header>
<!-- Main Layout -->
<main class="flex-1 flex flex-col items-center justify-center p-4 relative z-0">
<!-- Login Container -->
<div class="w-full max-w-[480px] bg-white rounded-2xl shadow-[0_8px_30px_rgb(0,0,0,0.04)] border border-slate-100 overflow-hidden relative">
<!-- Top Accent -->
<div class="h-1.5 w-full bg-primary absolute top-0 left-0"></div>
<div class="p-8 md:p-10">
<div class="flex flex-col gap-2 mb-8 text-center">
<h1 class="text-[#111318] text-3xl font-black leading-tight tracking-[-0.033em]">Welcome Back</h1>
<p class="text-slate-500 text-base font-normal">Securely access your financial portfolio</p>
</div>
<!-- HTMX Form -->
<form class="flex flex-col gap-5" hx-indicator="#loading-spinner" hx-post="/api/login" hx-target="#error-container" onsubmit="event.preventDefault(); /* For demo purposes prevent default */">
<!-- Error Container for HTMX responses -->
<div class="empty:hidden w-full text-sm text-red-600 bg-red-50 border border-red-100 rounded-lg p-3 text-center" id="error-container"></div>
<!-- Email / ID Input -->
<label class="flex flex-col gap-1.5">
<span class="text-slate-700 text-sm font-semibold leading-normal">Email or Account Number</span>
<div class="relative group">
<span class="absolute inset-y-0 left-0 flex items-center pl-3 text-slate-400 group-focus-within:text-primary transition-colors">
<span class="material-symbols-outlined text-[20px]">person</span>
</span>
<input class="form-input flex w-full rounded-lg text-slate-900 border border-slate-200 bg-slate-50 focus:bg-white focus:border-primary focus:ring-4 focus:ring-primary/10 h-12 pl-10 pr-4 placeholder:text-slate-400 text-base transition-all duration-200" name="username" placeholder="Enter your email or ID" required="" type="text"/>
</div>
</label>
<!-- Password Input -->
<label class="flex flex-col gap-1.5">
<div class="flex justify-between items-center">
<span class="text-slate-700 text-sm font-semibold leading-normal">Password</span>
<a class="text-primary text-sm font-semibold hover:underline" href="#">Forgot Password?</a>
</div>
<div class="relative group">
<span class="absolute inset-y-0 left-0 flex items-center pl-3 text-slate-400 group-focus-within:text-primary transition-colors">
<span class="material-symbols-outlined text-[20px]">lock</span>
</span>
<input class="form-input flex w-full rounded-lg text-slate-900 border border-slate-200 bg-slate-50 focus:bg-white focus:border-primary focus:ring-4 focus:ring-primary/10 h-12 pl-10 pr-10 placeholder:text-slate-400 text-base transition-all duration-200" name="password" placeholder="Enter your password" required="" type="password"/>
<button class="absolute inset-y-0 right-0 flex items-center pr-3 text-slate-400 hover:text-slate-600 cursor-pointer focus:outline-none" type="button">
<span class="material-symbols-outlined text-[20px]">visibility</span>
</button>
</div>
</label>
<!-- Submit Button -->
<button class="relative mt-2 flex w-full cursor-pointer items-center justify-center overflow-hidden rounded-lg h-12 px-4 bg-primary hover:bg-blue-700 text-white text-base font-bold leading-normal tracking-[0.015em] shadow-md shadow-blue-500/20 transition-all duration-200 active:scale-[0.98]">
<span class="htmx-indicator absolute left-4 animate-spin h-5 w-5 text-white" id="loading-spinner">
<span class="material-symbols-outlined text-[20px]">progress_activity</span>
</span>
<span>Log In</span>
<span class="material-symbols-outlined text-[18px] ml-2">arrow_forward</span>
</button>
</form>
<div class="my-8 flex items-center gap-3">
<div class="h-px flex-1 bg-slate-200"></div>
<span class="text-slate-400 text-xs font-medium uppercase tracking-wider">New to Citi Group?</span>
<div class="h-px flex-1 bg-slate-200"></div>
</div>
<div class="text-center">
<a class="inline-flex items-center justify-center w-full h-12 rounded-lg border border-slate-200 bg-white text-slate-700 font-bold hover:bg-slate-50 hover:border-slate-300 transition-all duration-200" href="#">
                        Sign up for an account
                    </a>
</div>
</div>
<!-- Trust Indicators -->
<div class="bg-slate-50 p-4 border-t border-slate-100 flex items-center justify-center gap-6">
<div class="flex items-center gap-1.5 text-slate-400" title="Secured by SSL">
<span class="material-symbols-outlined text-[16px]">lock_clock</span>
<span class="text-xs font-medium">256-bit Encryption</span>
</div>
<div class="flex items-center gap-1.5 text-slate-400" title="FDIC Insured">
<span class="material-symbols-outlined text-[16px]">verified_user</span>
<span class="text-xs font-medium">FDIC Insured</span>
</div>
</div>
</div>
<!-- Footer Links -->
<div class="mt-8 flex flex-wrap justify-center gap-6 text-sm text-slate-500">
<a class="hover:text-primary transition-colors" href="#">Privacy Policy</a>
<a class="hover:text-primary transition-colors" href="#">Terms of Service</a>
<a class="hover:text-primary transition-colors" href="#">Security Center</a>
</div>
<div class="mt-4 text-xs text-slate-400">
            © 2024 Citi Group. All rights reserved.
        </div>
</main>
