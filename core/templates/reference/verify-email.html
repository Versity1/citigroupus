<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Citi Group - Two-Factor Authentication</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"/>

<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#135bec",
                        "background-light": "#f6f6f8",
                        "background-dark": "#101622",
                    },
                    fontFamily: {
                        "display": ["Manrope", "sans-serif"]
                    },
                    borderRadius: {"DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px"},
                },
            },
        }
    </script>
</head>
<body class="bg-background-light dark:bg-background-dark font-display antialiased text-slate-900 dark:text-slate-100 min-h-screen flex flex-col">
<!-- Simplified Header for Security Context -->
<header class="flex items-center justify-between whitespace-nowrap border-b border-solid border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900 px-10 py-4">
<div class="flex items-center gap-4">
<div class="size-8 text-primary">

</div>
<h2 class="text-slate-900 dark:text-white text-lg font-bold leading-tight tracking-[-0.015em]">Citi Group</h2>
</div>
<div class="flex items-center gap-4">
<div class="hidden md:flex items-center gap-2 text-slate-500 dark:text-slate-400 text-sm">
<span class="material-symbols-outlined text-[20px]">lock</span>
<span>Secure Connection</span>
</div>
</div>
</header>
<!-- Main Content Area -->
<main class="flex-grow flex items-center justify-center p-6">
<div class="w-full max-w-lg">
<!-- 2FA Card -->
<div class="bg-white dark:bg-slate-900 rounded-xl shadow-sm border border-slate-200 dark:border-slate-800 p-8 md:p-10 flex flex-col gap-8 relative overflow-hidden">
<!-- Top Accent Line -->
<div class="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-primary to-blue-400"></div>
<!-- Header Section -->
<div class="flex flex-col gap-3 text-center">
<div class="mx-auto bg-primary/10 dark:bg-primary/20 p-4 rounded-full size-16 flex items-center justify-center mb-2">
<span class="material-symbols-outlined text-primary text-[32px]">shield_lock</span>
</div>
<h1 class="text-slate-900 dark:text-white text-3xl font-bold tracking-tight">Two-Factor Authentication</h1>
<p class="text-slate-500 dark:text-slate-400 text-base font-normal leading-relaxed">
                        For your security, please enter the 6-digit verification code sent to your device ending in <strong class="text-slate-900 dark:text-white font-medium">+1 234 *****89</strong>
</p>
</div>
<!-- Verification Form -->
<form class="flex flex-col gap-8">
<!-- Code Inputs -->
<div class="flex justify-center gap-2 sm:gap-4">
<input aria-label="Digit 1" autocomplete="one-time-code" autofocus="" class="w-12 h-14 sm:w-14 sm:h-16 text-center text-2xl font-semibold bg-white dark:bg-slate-800 text-slate-900 dark:text-white border border-slate-200 dark:border-slate-700 rounded-lg focus:outline-none focus:border-primary focus:ring-4 focus:ring-primary/10 transition-all shadow-sm placeholder-transparent" inputmode="numeric" maxlength="1" pattern="[0-9]*" type="text"/>
<input aria-label="Digit 2" class="w-12 h-14 sm:w-14 sm:h-16 text-center text-2xl font-semibold bg-white dark:bg-slate-800 text-slate-900 dark:text-white border border-slate-200 dark:border-slate-700 rounded-lg focus:outline-none focus:border-primary focus:ring-4 focus:ring-primary/10 transition-all shadow-sm placeholder-transparent" inputmode="numeric" maxlength="1" pattern="[0-9]*" type="text"/>
<input aria-label="Digit 3" class="w-12 h-14 sm:w-14 sm:h-16 text-center text-2xl font-semibold bg-white dark:bg-slate-800 text-slate-900 dark:text-white border border-slate-200 dark:border-slate-700 rounded-lg focus:outline-none focus:border-primary focus:ring-4 focus:ring-primary/10 transition-all shadow-sm placeholder-transparent" inputmode="numeric" maxlength="1" pattern="[0-9]*" type="text"/>
<input aria-label="Digit 4" class="w-12 h-14 sm:w-14 sm:h-16 text-center text-2xl font-semibold bg-white dark:bg-slate-800 text-slate-900 dark:text-white border border-slate-200 dark:border-slate-700 rounded-lg focus:outline-none focus:border-primary focus:ring-4 focus:ring-primary/10 transition-all shadow-sm placeholder-transparent" inputmode="numeric" maxlength="1" pattern="[0-9]*" type="text"/>
<input aria-label="Digit 5" class="w-12 h-14 sm:w-14 sm:h-16 text-center text-2xl font-semibold bg-white dark:bg-slate-800 text-slate-900 dark:text-white border border-slate-200 dark:border-slate-700 rounded-lg focus:outline-none focus:border-primary focus:ring-4 focus:ring-primary/10 transition-all shadow-sm placeholder-transparent" inputmode="numeric" maxlength="1" pattern="[0-9]*" type="text"/>
<input aria-label="Digit 6" class="w-12 h-14 sm:w-14 sm:h-16 text-center text-2xl font-semibold bg-white dark:bg-slate-800 text-slate-900 dark:text-white border border-slate-200 dark:border-slate-700 rounded-lg focus:outline-none focus:border-primary focus:ring-4 focus:ring-primary/10 transition-all shadow-sm placeholder-transparent" inputmode="numeric" maxlength="1" pattern="[0-9]*" type="text"/>
</div>
<!-- Resend Timer -->
<div class="flex flex-col items-center gap-2">
<p class="text-slate-500 dark:text-slate-400 text-sm">Didn't receive a code?</p>
<div class="flex items-center gap-2">
<button class="text-slate-400 cursor-not-allowed text-sm font-bold transition-colors flex items-center gap-1" disabled="" type="button">
<span class="material-symbols-outlined text-[16px]">refresh</span>
                                Resend Code
                            </button>
<span class="text-slate-300 dark:text-slate-600">|</span>
<span class="text-primary font-bold text-sm tabular-nums">00:30</span>
</div>
</div>
<!-- Action Buttons -->
<div class="flex flex-col gap-4 pt-2">
<button class="flex w-full cursor-pointer items-center justify-center overflow-hidden rounded-lg h-12 px-4 bg-primary hover:bg-blue-700 text-white text-base font-bold leading-normal tracking-[0.015em] transition-colors shadow-lg shadow-primary/20">
                            Verify and Login
                        </button>
<a class="text-slate-500 hover:text-slate-900 dark:text-slate-400 dark:hover:text-white text-sm font-medium text-center transition-colors" href="#">
                            Back to login
                        </a>
</div>
</form>
</div>
<!-- Footer Help -->
<div class="mt-8 flex justify-center gap-6 text-sm text-slate-500 dark:text-slate-400">
<a class="hover:text-primary transition-colors" href="#">Help Center</a>
<a class="hover:text-primary transition-colors" href="#">Privacy Policy</a>
<a class="hover:text-primary transition-colors" href="#">Terms of Service</a>
</div>
</div>
</main>
</body></html>
