{% load static %}
<!DOCTYPE html>
<html lang="en" class="">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{% block title %}Citi Group{% endblock %} | Citi Group</title>
    <meta name="description" content="{% block meta_description %}Citi Group — Your Trusted Digital Banking Partner{% endblock %}">

    <!-- TailwindCSS CDN -->
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script>
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#255BE3",
                        "primary-dark": "#1d4dc4",
                        "navy": "#0F1632",
                        "navy-light": "#1a2340",
                        "accent": "#FF3C28",
                        "gold": "#C5A059",
                        "gold-light": "#E6C985",
                        "slate-dark": "#0F1632",
                        "slate-light": "#64748b",
                        "background-light": "#F7F8FA",
                        "background-dark": "#0A0E1F",
                    },
                    fontFamily: {
                        "display": ["Inter", "sans-serif"],
                        "sans": ["Inter", "sans-serif"],
                        "serif": ["Playfair Display", "Georgia", "serif"],
                    },
                    borderRadius: {
                        "DEFAULT": "0.375rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "2xl": "1rem",
                        "full": "9999px",
                    },
                },
            },
        };
    </script>

    <!-- Google Fonts: Inter & Playfair Display -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Playfair+Display:wght@400;500;600;700&display=swap" rel="stylesheet" />

    <!-- Material Symbols -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />

    <!-- HTMX -->
    <script src="https://unpkg.com/htmx.org@2.0.4"></script>

    <!-- Custom Styles -->
    <style>
        /* HTMX loading indicators */
        .htmx-indicator { display: none; }
        .htmx-request .htmx-indicator { display: inline-flex; }
        .htmx-request.htmx-indicator { display: inline-flex; }

        /* Smooth transitions */
        * { transition-property: color, background-color, border-color, box-shadow; transition-duration: 200ms; transition-timing-function: ease; }

        /* Custom scrollbar */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 99px; }
        .dark ::-webkit-scrollbar-thumb { background: #334155; }

        /* Card shimmer effect */
        .card-shine { background: linear-gradient(135deg, rgba(255,255,255,0) 30%, rgba(255,255,255,0.1) 50%, rgba(255,255,255,0) 70%); background-size: 200% 200%; animation: shine 3s infinite; }
        @keyframes shine { 0% { background-position: -100% -100%; } 100% { background-position: 200% 200%; } }

        /* Glassmorphism */
        .glass { background: rgba(255, 255, 255, 0.7); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.2); }
        .dark .glass { background: rgba(30, 41, 59, 0.7); border: 1px solid rgba(51, 65, 85, 0.5); }

        /* Fade in animation */
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .animate-fade-in { animation: fadeIn 0.4s ease-out; }

        /* Slide up for mobile nav */
        @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
        .animate-slide-up { animation: slideUp 0.3s ease-out; }
    </style>
    {% block extra_head %}{% endblock %}
</head>
<body class="font-sans text-slate-900 dark:text-slate-100 bg-background-light dark:bg-background-dark min-h-screen" hx-boost="true">
    {% block body %}{% endblock %}

    <!-- Dark mode toggle script -->
    <script>
        function toggleDarkMode() {
            document.documentElement.classList.toggle('dark');
            localStorage.setItem('darkMode', document.documentElement.classList.contains('dark'));
        }
        // Load saved preference
        if (localStorage.getItem('darkMode') === 'true') {
            document.documentElement.classList.add('dark');
        }
    </script>
    <!-- Smartsupp Live Chat script -->
<script type="text/javascript">
var _smartsupp = _smartsupp || {};
_smartsupp.key = '9a74e510f8f25a19e1811df579dda0411c5ff2a6';
window.smartsupp||(function(d) {
  var s,c,o=smartsupp=function(){ o._.push(arguments)};o._=[];
  s=d.getElementsByTagName('script')[0];c=d.createElement('script');
  c.type='text/javascript';c.charset='utf-8';c.async=true;
  c.src='https://www.smartsuppchat.com/loader.js?';s.parentNode.insertBefore(c,s);
})(document);
</script>
<noscript>Powered by <a href="https://www.smartsupp.com" target="_blank">Smartsupp</a></noscript>

    {% block extra_scripts %}{% endblock %}

    <!-- Floating Google Translator Button -->
    <style>
        #floating-translate-wrapper {
            position: fixed;
            bottom: 24px;
            left: 24px;
            z-index: 9999;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: #ffffff;
            border-radius: 9999px;
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.12), 0 1px 3px rgba(0, 0, 0, 0.06);
            padding: 6px 14px 6px 12px;
            border: 1px solid rgba(0, 0, 0, 0.08);
            transition: all 0.25s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            cursor: pointer;
            height: 36px;
            box-sizing: border-box;
            max-width: 170px;
        }
        #floating-translate-wrapper:hover {
            box-shadow: 0 6px 20px rgba(37, 91, 227, 0.25);
            border-color: rgba(37, 91, 227, 0.4);
            transform: translateY(-1px);
        }
        .dark #floating-translate-wrapper {
            background: #0F1632;
            border-color: rgba(255, 255, 255, 0.15);
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.4);
        }
        .dark #floating-translate-wrapper:hover {
            box-shadow: 0 6px 20px rgba(37, 91, 227, 0.35);
            border-color: rgba(37, 91, 227, 0.5);
        }
        .translate-btn-icon {
            font-size: 18px !important;
            color: #255BE3;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .dark .translate-btn-icon {
            color: #60a5fa;
        }
        #google_translate_element {
            display: inline-flex;
            align-items: center;
            line-height: 1;
        }
        #google_translate_element img {
            display: inline !important;
            vertical-align: middle !important;
        }
        .goog-te-combo {
            border: none !important;
            background: transparent !important;
            color: #374151 !important;
            outline: none !important;
            font-family: 'Inter', sans-serif !important;
            font-weight: 600 !important;
            font-size: 12px !important;
            margin: 0 !important;
            padding: 0 2px !important;
            cursor: pointer;
            max-width: 110px;
            height: auto !important;
            line-height: 1.2 !important;
        }
        .dark .goog-te-combo {
            color: #e2e8f0 !important;
            background: #0F1632 !important;
        }
        .goog-te-gadget {
            font-size: 0px !important;
            color: transparent !important;
            display: inline-flex !important;
            align-items: center !important;
            margin: 0 !important;
            padding: 0 !important;
            line-height: 1 !important;
        }
        .goog-te-gadget > span > a,
        .goog-te-banner-frame.skiptranslate,
        .goog-logo-link {
            display: none !important;
        }
        .goog-te-gadget-simple {
            background-color: transparent !important;
            border: none !important;
            padding: 0 !important;
            font-size: 12px !important;
            display: inline-flex !important;
            align-items: center !important;
        }
        .goog-te-gadget-simple span {
            color: #374151 !important;
            font-size: 12px !important;
            font-family: 'Inter', sans-serif !important;
            font-weight: 600 !important;
        }
        .dark .goog-te-gadget-simple span {
            color: #e2e8f0 !important;
        }
        .goog-te-gadget-simple .goog-te-menu-value span {
            border-left: none !important;
        }
        .goog-te-gadget-simple .goog-te-menu-value img {
            display: none !important;
        }
        body {
            top: 0px !important;
        }
        .goog-te-gadget .goog-te-combo {
            margin: 0 !important;
        }
    </style>

    <div id="floating-translate-wrapper" title="Change Language">
        <span class="material-symbols-outlined translate-btn-icon">translate</span>
        <div id="google_translate_element"></div>
    </div>
    <script type="text/javascript">
        function googleTranslateElementInit() {
            new google.translate.TranslateElement({
                pageLanguage: 'en',
                autoDisplay: false
            }, 'google_translate_element');
        }
    </script>
    <script type="text/javascript" src="//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>
</body>
</html>
